    <script>

        window.addEventListener('load', () => {

     <!-- Cloudflare Web Analytics：无 cookie，只在生产域名加载，避免本地开发/E2E 打点 -->

      if (location.hostname === 'drop.tianzora.uno') {

        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        beacon.dataset.cfBeacon = '{"token":"e981fda9d57846adb2ddf5216658c889"}';
