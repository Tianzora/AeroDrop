name: CI

on: [push, pull_request]

# 同一分支/PR 的新提交取消上一轮构建，避免排队烧分钟数。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `vite build` 不做类型检查，typecheck 必须显式跑在 build 之前。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:all

      # 覆盖率门槛用 node:test 内置能力，不引入依赖；阈值在 scripts/node-test-args.mjs。
      # 这一步跑 scripts/check-coverage-scope.mjs：它先跑一次普通覆盖率报告，再用 git 清单
      # 要求 services/ 与 src/ 下每个生产源文件都出现在报告里（可以 0%，但不能消失）。
      # Node 的覆盖率报告只列「被加载过」的文件，所以必须有这层 git 对比守卫来补分母；
      # 刻意不使用 `--test-coverage-include`（Node 22.12 上会让测试进程一行报告都不产出）。
      # 无法在 Node 宿主里加载的少数文件登记在脚本的 ALLOWED_UNCOVERED 里，并写明理由。
      - name: Unit test coverage gate
        run: node ./scripts/check-coverage-scope.mjs

      # 组件覆盖率单独卡一套更低的阈值（计入未被测试加载的组件后：61.7 行 / 64.6 分支 / 43.6 函数）：
      # 组件测试大量走 DOM 桩，函数覆盖率天然偏低，用 services 的阈值会逼出无意义断言。
      # 这里同样走普通报告（不传 include，避免 Node 22.12 的过滤器问题）；分母完整性由上面
      # services 那道 git 对比门禁负责。
      - name: Component coverage gate
        env:
          NODE_TEST_COVERAGE: '1'
          NODE_TEST_COVERAGE_MIN_LINES: '60'
          NODE_TEST_COVERAGE_MIN_BRANCHES: '58'
          NODE_TEST_COVERAGE_MIN_FUNCTIONS: '40'
        run: node ./scripts/run-node-tests.mjs components

      - name: Build
        run: npm run build

  e2e:
    name: e2e (chromium)
    # Playwright 1.59 只认到 ubuntu 24.04；`ubuntu-latest` 已漂到 26.04，
    # `playwright install --with-deps` 会直接拒绝安装（Cannot install dependencies for ubuntu26.04-x64）。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # test:e2e 自带 `vite build --mode e2e` + preview(:3401)，只跑浏览器侧用例；
      # 屏幕共享用例需要真实 Worker 信令，挂在 test:e2e:product-transfer 里（CI 不跑）。
      - name: Browser tests
        run: npm run test:e2e
