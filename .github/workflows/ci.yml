name: CI

on: [push, pull_request]

# 同一分支/PR 的新提交取消上一轮构建，避免排队烧分钟数。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `vite build` 不做类型检查，typecheck 必须显式跑在 build 之前。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:all

      # 覆盖率门槛用 node:test 内置能力，不引入依赖；阈值在 scripts/node-test-args.mjs。
      # 只对 services 卡阈值：组件测试大量走 DOM 桩，函数覆盖低不代表回归风险高。
      - name: Unit test coverage gate
        env:
          NODE_TEST_COVERAGE: '1'
        run: node ./scripts/run-node-tests.mjs services

      - name: Build
        run: npm run build

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # test:e2e 自带 `vite build --mode e2e` + preview(:3401)，只跑浏览器侧用例；
      # 屏幕共享用例需要真实 Worker 信令，挂在 test:e2e:product-transfer 里（CI 不跑）。
      - name: Browser tests
        run: npm run test:e2e
