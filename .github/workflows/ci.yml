name: CI

on: [push, pull_request]

# 同一分支/PR 的新提交取消上一轮构建，避免排队烧分钟数。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `vite build` 不做类型检查，typecheck 必须显式跑在 build 之前。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:all

      # 覆盖率门槛用 node:test 内置能力，不引入依赖；阈值与白名单都在 scripts/check-coverage-scope.mjs。
      # 这一步做三件事：跑一遍 services/src 的覆盖率报告、用 git 清单要求每个生产源文件都出现在
      # 报告里（可以 0%，但不能消失）、拒绝「进了分母但 line 覆盖率 0%」的文件。
      # 刻意不使用 `--test-coverage-include`：它在 Node 22.12 上会让测试进程一行报告都不产出。
      # 无法在 Node 宿主里加载的少数文件登记在该脚本的 allowlist 里，并写明理由。
      - name: Unit test coverage gate (services + src)
        run: node ./scripts/check-coverage-scope.mjs --scope=services

      # 组件 scope 有自己的一套阈值，且**只按组件自己的行判定**：范围外的
      # services/constants/types/src 由 coverageExclude 挡在报告之外，再用 all files 汇总行
      # 判门槛。实测（2026-11-14，本仓工作树）scope 内 63.35 行 / 68.42 分支 / 42.86 函数；
      # 不排除时混合口径是 68.60 / 68.37 / 41.94——旧写法拿混合口径判 60% 行门槛，
      # 组件实际跌到 51.8% 也能过，脚本现在会把两个数字都打出来便于对照。
      # 组件测试大量走 DOM 桩，函数覆盖率天然偏低，所以阈值比 services 低。
      # 分母由 git 清单对比保证：components/ 下 12 个生产文件里 Receiver（streamsaver 在
      # 模块顶层读 document）、ScreenShare 与 Sender（没有任何组件测试 import、渲染依赖真实
      # WebRTC/采集能力）三个登记为白名单并写明理由；ErrorBoundary 与 PWAInstallPrompt
      # 由 scripts/component-import-smoke.test.ts 拉进分母。
      - name: Component coverage gate
        run: node ./scripts/check-coverage-scope.mjs --scope=components

      - name: Build
        run: npm run build

  e2e:
    name: e2e (chromium)
    # Playwright 1.59 只认到 ubuntu 24.04；`ubuntu-latest` 已漂到 26.04，
    # `playwright install --with-deps` 会直接拒绝安装（Cannot install dependencies for ubuntu26.04-x64）。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # test:e2e 自带 `vite build --mode e2e` + preview(:3401)，只跑不需要真实 Worker 的浏览器侧用例
      # （sender-sharing、receiver-recovery）。需要真实 Worker 信令的 product-transfer / screenshare
      # 用例在下方的 e2e-product job 里跑：两者构建模式不同（e2e vs production），而且产品级用例慢
      # （本地实测约 2-3 分钟），合进同一个 job 只会拖长反馈时间。
      - name: Browser tests
        run: npm run test:e2e

      # 失败证据：trace/screenshot 由 playwright.config.ts 的 retain-on-failure /
      # only-on-failure 产出，全落在 test-results/。必须 always() 才拿得到；失败时缺文件
      # 也要在日志里喊一声（warn），而不是安静地跳过。
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  e2e-product:
    name: 'e2e (product: transfer + screenshare, real Worker)'
    # 与上面的 e2e job 同样的 24.04 理由。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `wrangler dev` 在本地模式（workerd）里跑，不需要 Cloudflare 账号或网络；
      # 关掉遥测、并显式声明 CI，避免它尝试任何交互式提示。
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 8787 必须是空的：start-server-and-test 只等这个端口可连，被占用时会误判「服务已就绪」，
      # 然后把 playwright 指到别人的服务上。
      - name: Assert port 8787 is free
        run: |
          if ss -ltn | grep -q ':8787 '; then
            echo 'port 8787 is already in use'
            ss -ltnp | grep ':8787 ' || true
            exit 1
          fi

      # test:e2e:product-transfer = `npm run build` + `wrangler dev`(:8787) + playwright
      # --config=playwright.product.config.ts，覆盖 product-transfer.spec.ts（3 条：SEO 元数据、
      # 2 MiB 真实传输、口令撤销宽限恢复）与 screenshare.spec.ts（9 条：分享/观看帧增长、
      # 信令被拒终态、登记限流、瞬时失败恢复、卡住终态、房号过期、停止后立即重启、观众媒体失败、
      # 第 7 位观众满员提示）。屏幕共享用 Chromium 的 fake display capture（flag 见
      # playwright.product.config.ts），因此 runner 上不需要 X server 或真实屏幕。
      - name: Product tests (transfer + screenshare)
        run: npm run test:e2e:product-transfer

      # start-server-and-test 只 kill 它直接启动的 npm 进程，wrangler 的 workerd 子进程可能活下来。
      - name: Kill stray worker processes
        if: always()
        run: |
          pkill -f 'wrangler dev' || true
          pkill -f workerd || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-product-transfer
          # reporter 是 list，不会生成 playwright-report/；有内容的只有 test-results/
          # （trace / screenshot / error-context）。
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
